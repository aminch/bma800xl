name: Release

# Pushing a tag starting with v (v1.0.0) builds the SD card files and
# creates a draft release with them. The tag must match the
# VERSION file. The PC tests run first, then each board is built on its
# own runner, and the release job puts their files together.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        env:
          ACTUAL_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="v$(tools/version.sh --semver)"
          if [ "$ACTUAL_TAG" != "$expected_tag" ]; then
            echo "Tag must be $expected_tag (from VERSION), but received $ACTUAL_TAG"
            exit 1
          fi

      - name: Fetch atari800
        run: git submodule update --init --depth 1 third_party/atari800

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texinfo wget imagemagick python3-pil

      - name: PC tests
        run: |
          tools/hostsim/run_tests.sh
          tools/pi4kms/run_tests.sh
          tools/pi4scaler/run_tests.sh
          if [ "$(python3 tools/update/updater_cfg.py kernel)" = "yes" ]
          then
            python3 tools/update/test/run_tests.py
          fi

  build:
    needs: tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pi0, pi2, pi3, pi4, pi5]
    steps:
      - uses: actions/checkout@v4

      # Only the submodules make_all.sh uses.
      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 third_party/atari800 third_party/circle-stdlib
          git -C third_party/circle-stdlib submodule update --init --depth 1 libs/circle libs/circle-newlib
          git -C third_party/circle-stdlib/libs/circle submodule update --init --depth 1 addon/wlan/hostap

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texinfo wget imagemagick python3-pil

      - name: Cache Arm GNU Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/bma800xl/toolchains
          key: arm-gnu-toolchain-15.2.rel1-arm-none-eabi-aarch64-none-elf

      - name: Build ${{ matrix.board }}
        run: ./build_sdcard.sh ${{ matrix.board }} --skip-tests

      - name: Upload ${{ matrix.board }} SD card files
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-${{ matrix.board }}
          path: build/sdcard/
          if-no-files-found: error
          retention-days: 1

  # Needs no submodules: each board's build has already checked its files
  # against them.
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Put the boards' files together
        uses: actions/download-artifact@v4
        with:
          pattern: sdcard-*
          path: build/sdcard
          merge-multiple: true

      # Each board's manifest lists only its own kernel.
      - name: Write the updater's manifest
        run: |
          if [ "$(python3 tools/update/updater_cfg.py kernel)" = "yes" ]
          then
            python3 tools/update/gen_update_manifest.py release \
              --stage build/sdcard --version "v$(tools/version.sh --semver)"
          fi

      - name: Check the release files
        run: ./check_release_files.sh --release

      - name: Zip the SD card files
        run: cd build/sdcard && zip -r "../../bma800xl-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BMA800XL ${{ github.ref_name }}
          files: bma800xl-${{ github.ref_name }}.zip
          generate_release_notes: false
          draft: true
