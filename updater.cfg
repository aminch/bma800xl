# BMA800XL Updater settings
#
# The updater has two parts:
#   - the updater built into BMA800XL, which applies /bma800xl-update.zip at
#     boot (see docs/UPDATER.md);
#   - the Web UI's Update page, which lists releases from GitHub, checks a
#     downloaded release zip and uploads it as bma800xl-update.zip.
#
# If you fork BMA800XL, set repo to your own GitHub repository, then build the
# list of official releases for it; see "The BMA800XL Updater" in
# docs/BUILDING.md, which also lists everything these settings change.

# on           the updater and the Web UI's Update page.
#
# kernel_only  the updater only, with no Update page in the Web UI: an update
#              is just a release zip copied to the card as bma800xl-update.zip,
#              which BMA800XL applies at boot.
#
# off          no updater at all: bma800xl-update.zip is ignored. You can also
#              just delete this file to disable the updater entirely.
updater = on

# The GitHub repository (owner/name) whose releases are official.
#
# It is used for two things:
#   - the Web UI's Update page (updater = on) lists and trusts its releases
#   - the release tools (tools/update/gen_update_manifest.py, run by
#     make_all.sh) find its newly published releases and add them to the
#     release history that every release's bma800xl-manifest.txt is made from.
#
# With kernel_only, BMA800XL itself never uses it: the kernel only reads the
# bma800xl-update.zip on the card. Leave it empty to never contact GitHub. The
# Web UI's Update page then shows no release list and recognises only the
# releases built into it, and the release history has to be kept by hand
# (gen_update_manifest.py add). This setting is not used with "updater = off".
repo = aminch/bma800xl
